name: CI

on:
  push:
    branches: [main]
    # A version tag (v1.2.0) also publishes the APK as a GitHub Release.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # The live API, compiled into the APK. A standalone build has no dev server
  # to infer a host from, so changing this means building again.
  API_ORIGIN: https://api.zassfood.zasstech.com

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android/ is generated on every build, so cache Gradle's own downloads
      # (wrapper, dependencies) rather than the project.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.config.ts', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_UPDATE_URL: ${{ vars.EXPO_UPDATE_URL }}
        run: ./scripts/build-apk.sh "$API_ORIGIN"

      - name: Name the APK after the commit
        id: apk
        run: |
          name="zassdeliver-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          mv dist/zassdeliver-preview.apk "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: zassdeliver-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
